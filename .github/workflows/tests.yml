name: padstream_rt tests

on:
  push:
    paths: ["padstream_rt/**", "tests/**", "pyproject.toml"]
  pull_request:
    paths: ["padstream_rt/**", "tests/**", "pyproject.toml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test,chem,validate]"
      - run: pytest -q
