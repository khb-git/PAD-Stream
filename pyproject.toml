[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padstream-rt"
version = "0.1.0"
description = "Reactive transport for the PAD-Stream 3D streamline CO2 simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
legacy = ["pandas", "matplotlib", "highspy==1.15.1"]
ml = ["torch>=2.1"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["padstream_rt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
